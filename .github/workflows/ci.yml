name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck shfmt bats jq dnsutils openssl curl python3
      - name: Syntax, static analysis, format and offline tests
        run: bash scripts/check.sh
      - name: Verify release packaging without publishing
        run: bash scripts/package-release.sh "v$(bash reality-target-checker.sh --version)"
